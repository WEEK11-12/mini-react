title: "Daily Scrum"
body:
  - type: textarea
    id: yesterday
    attributes:
      label: 어제 한 일
      description: 완료한 작업이나 진행 상황을 적어주세요.
      placeholder: 예) SPT copy 구현, 테스트 확인
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: 오늘 할 일
      placeholder: 오늘 진행할 작업을 적어주세요.
    validations:
      required: true

  - type: textarea
    id: blockers
    attributes:
      label: 막힌 점
      description: 없으면 '없음'이라고 적어주세요.
      placeholder: 예) mmap 테스트 실패 원인 확인
