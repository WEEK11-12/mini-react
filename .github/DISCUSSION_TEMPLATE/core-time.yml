title: "[Core Time] YYYY-MM-DD"
body:
  - type: markdown
    attributes:
      value: |
        오늘 논의할 주제와 완료할 이슈를 작성해 주세요.
        작업 중 공유할 자료, 질문, 논의 과정과 결정사항은
        이 Discussion의 댓글로 이어서 기록합니다.

  - type: textarea
    id: topics
    attributes:
      label: 오늘 논의할 주제
      description: 함께 이야기하거나 결정할 내용을 적어 주세요.
      placeholder: |
        예시:
        - 요구사항 명세 형식 합의
        - History의 동작 범위 결정
    validations:
      required: true

  - type: textarea
    id: issues
    attributes:
      label: 오늘 완료할 이슈
      description: 이슈 번호 또는 URL과 오늘 완료할 범위를 적어 주세요.
      placeholder: |
        예시:
        - #12 — 요구사항 초안 작성
        - #15 — React 핵심 동작 조사 및 공유
    validations:
      required: true
